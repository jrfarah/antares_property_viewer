<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTARES Properties Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0b0f14;
      --bg2:       #111820;
      --bg3:       #18222e;
      --bg4:       #0e1a26;
      --border:    #1e2d3d;
      --border2:   #253545;
      --text:      #c9d6e3;
      --text-dim:  #5d7a95;
      --text-mute: #374a5e;
      --accent:    #e8a838;
      --accent2:   #c68520;
      --teal:      #36b5a2;
      --red:       #e05c5c;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'DM Sans', sans-serif;
      --radius:    6px;
      --row-hover: #131e2b;
      --row-open:  #0f1c2a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex; align-items: center; gap: 18px;
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,15,20,0.97);
      backdrop-filter: blur(8px);
    }
    .logo { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .logo-icon { width: 32px; height: 32px; }
    .logo-text { font-family: var(--mono); font-size: 12px; line-height: 1.35; }
    .logo-text strong { display: block; color: var(--accent); font-size: 14px; letter-spacing: 0.05em; }
    .logo-text span   { color: var(--text-dim); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; }
    .hdiv { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }
    .header-right { flex: 1; display: flex; align-items: center; gap: 10px; }

    /* ── SEARCH ── */
    .search-wrap { position: relative; flex: 1; max-width: 460px; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    .search-input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border2);
      border-radius: var(--radius); color: var(--text); font-family: var(--sans);
      font-size: 13px; padding: 8px 32px 8px 34px; outline: none; transition: border-color 0.18s;
    }
    .search-input::placeholder { color: var(--text-mute); }
    .search-input:focus { border-color: var(--accent2); }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      padding: 2px 4px; font-size: 13px; display: none; line-height: 1;
    }
    .search-clear:hover { color: var(--text); }

    /* ── TABS ── */
    .tabs {
      display: flex; gap: 3px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 3px;
    }
    .tab-btn {
      font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 5px 12px;
      border: none; border-radius: 4px; cursor: pointer; background: transparent;
      color: var(--text-dim); transition: all 0.15s; white-space: nowrap;
    }
    .tab-btn.active { background: var(--accent); color: #0b0f14; font-weight: 600; }
    .tab-count { margin-left: 4px; font-size: 10px; opacity: 0.7; }

    /* ── STATUS BAR ── */
    .statusbar {
      padding: 7px 32px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); background: var(--bg2); min-height: 38px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-mute); flex-shrink: 0; }
    .status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
    .status-dot.ok      { background: var(--teal); }
    .status-dot.error   { background: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .status-msg  { font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .gen-date    { font-family: var(--mono); font-size: 10px; color: var(--text-mute); margin-left: auto; white-space: nowrap; }
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip {
      font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 20px;
      border: 1px solid var(--border2); background: transparent; color: var(--text-dim);
      cursor: pointer; transition: all 0.13s; letter-spacing: 0.02em;
    }
    .chip:hover { border-color: var(--accent2); color: var(--accent); }
    .chip.active { border-color: var(--accent); background: rgba(232,168,56,0.1); color: var(--accent); }
    .chip.type-int    { color: #6eb6f7; border-color: #1d3d5a; }
    .chip.type-float  { color: #9d7be0; border-color: #2d1f50; }
    .chip.type-str    { color: #6ecf7a; border-color: #1a3b20; }
    .chip.type-bool   { color: #f07676; border-color: #3d1e1e; }
    .chip.type-int.active    { background: rgba(110,182,247,0.1); border-color: #6eb6f7; }
    .chip.type-float.active  { background: rgba(157,123,224,0.1); border-color: #9d7be0; }
    .chip.type-str.active    { background: rgba(110,207,122,0.1); border-color: #6ecf7a; }
    .chip.type-bool.active   { background: rgba(240,118,118,0.1); border-color: #f07676; }
    .chips-sep { width: 1px; height: 14px; background: var(--border2); flex-shrink: 0; }

    /* ── MAIN ── */
    main { padding: 0 32px 48px; }
    .section-header { padding: 24px 0 4px; display: flex; align-items: baseline; gap: 12px; }
    .section-header h2 { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.05em; }
    .section-header p  { font-size: 12px; color: var(--text-mute); }
    .results-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 0; }
    .results-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
    .results-count strong { color: var(--accent); }
    .kbd-hint { font-family: var(--mono); font-size: 10px; color: var(--text-mute); }
    .kbd { background: var(--bg3); border: 1px solid var(--border2); border-radius: 3px; padding: 1px 5px; }

    /* ── TABLE ── */
    .table-wrap {
      overflow-x: auto; border: 1px solid var(--border);
      border-radius: var(--radius); margin-top: 12px;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--bg2); border-bottom: 1px solid var(--border2); }
    th {
      font-family: var(--mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-dim); padding: 10px 14px;
      text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
    }
    th:hover { color: var(--accent); }
    th.sorted-asc::after  { content: ' ↑'; color: var(--accent); }
    th.sorted-desc::after { content: ' ↓'; color: var(--accent); }

    /* ── DATA ROWS ── */
    tr.data-row {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    tr.data-row:hover { background: var(--row-hover); }
    tr.data-row.expanded { background: var(--row-open); border-bottom: none; }
    tr.data-row.expanded td.col-name { color: var(--accent); }

    /* caret indicator */
    tr.data-row td.col-name::before {
      content: '▶';
      display: inline-block;
      font-size: 7px;
      color: var(--text-mute);
      margin-right: 7px;
      transition: transform 0.18s, color 0.18s;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
    tr.data-row.expanded td.col-name::before {
      transform: rotate(90deg);
      color: var(--accent);
    }

    td { padding: 9px 14px; vertical-align: middle; }
    .col-name   { font-family: var(--mono); font-size: 12px; color: #a8c8e8; white-space: nowrap; width: 220px; }
    .col-type   { width: 68px; white-space: nowrap; }
    .col-origin { width: 90px; white-space: nowrap; }
    .col-desc   { color: var(--text); font-size: 13px; line-height: 1.5;
                  max-width: 600px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── EXPAND ROW ── */
    tr.expand-row { border-bottom: 1px solid var(--border); }
    tr.expand-row td { padding: 0; }
    .expand-inner {
      padding: 14px 18px 16px 42px;   /* left-indent aligns with name column text */
      background: var(--bg4);
      border-top: 1px solid var(--border);
      display: grid;
      gap: 12px;
    }

    /* full description */
    .expand-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.65;
      max-width: 760px;
    }

    /* copy + link row */
    .expand-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .copy-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .copy-btn:hover { border-color: var(--accent2); color: var(--accent); }
    .copy-btn.copied { border-color: var(--teal); color: var(--teal); }
    .copy-btn .copy-label { transition: opacity 0.2s; }
    .api-link {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-mute);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .api-link:hover { color: var(--text-dim); border-color: var(--border2); }

    /* related properties */
    .expand-related {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .related-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-mute);
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .related-chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .related-chip {
      font-family: var(--mono);
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 3px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.13s;
      white-space: nowrap;
    }
    .related-chip:hover { border-color: var(--accent2); color: var(--accent); background: rgba(232,168,56,0.05); }

    /* type/origin badges */
    .badge {
      display: inline-block; font-family: var(--mono); font-size: 10px;
      padding: 1px 7px; border-radius: 3px; letter-spacing: 0.02em;
    }
    .badge-int    { background: rgba(110,182,247,0.1); color: #6eb6f7; border: 1px solid rgba(110,182,247,0.2); }
    .badge-float  { background: rgba(157,123,224,0.1); color: #9d7be0; border: 1px solid rgba(157,123,224,0.2); }
    .badge-str    { background: rgba(110,207,122,0.1); color: #6ecf7a; border: 1px solid rgba(110,207,122,0.2); }
    .badge-bool   { background: rgba(240,118,118,0.1); color: #f07676; border: 1px solid rgba(240,118,118,0.2); }
    .badge-other  { background: rgba(150,150,150,0.08); color: #888;   border: 1px solid rgba(150,150,150,0.15); }
    .origin-tag   { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
    .origin-antares { color: var(--accent); }
    .origin-ztf     { color: var(--teal); }

    mark { background: rgba(232,168,56,0.22); color: var(--accent); border-radius: 2px; padding: 0 1px; }

    /* ── STATES ── */
    .state-box { padding: 56px 32px; text-align: center; }
    .state-title { font-family: var(--mono); font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
    .state-sub { font-size: 12px; color: var(--text-mute); max-width: 460px; margin: 0 auto; line-height: 1.65; }
    .state-sub code { font-family: var(--mono); font-size: 11px; background: var(--bg3); padding: 1px 5px; border-radius: 3px; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid var(--border2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      margin-top: 20px; padding: 18px 22px;
      border: 1px solid rgba(224,92,92,0.3); border-radius: var(--radius);
      background: rgba(224,92,92,0.05); display: none;
    }
    .error-box h3 { color: var(--red); font-size: 13px; margin-bottom: 8px; font-family: var(--mono); }
    .error-box p  { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
    .error-box code { font-family: var(--mono); font-size: 11px; background: var(--bg3); padding: 1px 5px; border-radius: 3px; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    @media (max-width: 680px) {
      header { padding: 12px 14px; flex-wrap: wrap; }
      .hdiv { display: none; }
      main { padding: 0 14px 40px; }
      .statusbar { padding: 7px 14px; flex-wrap: wrap; }
      .gen-date { display: none; }
      .col-origin, .col-type { display: none; }
      .expand-inner { padding-left: 14px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="15" stroke="#e8a838" stroke-width="1.2" opacity="0.25"/>
      <circle cx="16" cy="16" r="9"  stroke="#e8a838" stroke-width="1"   opacity="0.45"/>
      <circle cx="16" cy="16" r="3.5" fill="#e8a838" opacity="0.9"/>
      <line x1="16" y1="2"  x2="16" y2="8"  stroke="#e8a838" stroke-width="1.1" opacity="0.5"/>
      <line x1="16" y1="24" x2="16" y2="30" stroke="#e8a838" stroke-width="1.1" opacity="0.5"/>
      <line x1="2"  y1="16" x2="8"  y2="16" stroke="#e8a838" stroke-width="1.1" opacity="0.5"/>
      <line x1="24" y1="16" x2="30" y2="16" stroke="#e8a838" stroke-width="1.1" opacity="0.5"/>
      <line x1="5.5"  y1="5.5"  x2="9.5"  y2="9.5"  stroke="#e8a838" stroke-width="0.8" opacity="0.3"/>
      <line x1="22.5" y1="22.5" x2="26.5" y2="26.5" stroke="#e8a838" stroke-width="0.8" opacity="0.3"/>
      <line x1="26.5" y1="5.5"  x2="22.5" y2="9.5"  stroke="#e8a838" stroke-width="0.8" opacity="0.3"/>
      <line x1="5.5"  y1="26.5" x2="9.5"  y2="22.5" stroke="#e8a838" stroke-width="0.8" opacity="0.3"/>
    </svg>
    <div class="logo-text">
      <strong>ANTARES</strong>
      <span>Properties Browser</span>
    </div>
  </div>

  <div class="hdiv"></div>

  <div class="header-right">
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 13 13" fill="none">
        <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.5"/>
        <line x1="8.5" y1="8.5" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-input" id="searchInput" type="text"
             placeholder="Search name, description, origin…" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" title="Clear search">✕</button>
    </div>

    <div class="tabs" id="tabGroup">
      <button class="tab-btn active" data-tab="locus">
        Locus<span class="tab-count" id="locusTabCount"></span>
      </button>
      <button class="tab-btn" data-tab="alert">
        Alert<span class="tab-count" id="alertTabCount"></span>
      </button>
    </div>
  </div>
</header>

<div class="statusbar">
  <div class="status-dot loading" id="statusDot"></div>
  <span class="status-msg" id="statusMsg">Loading properties.json…</span>
  <div class="filter-chips" id="filterChips"></div>
  <span class="gen-date" id="genDate"></span>
</div>

<main>
  <div class="error-box" id="errorBox"></div>

  <div class="section-header">
    <h2 id="sectionTitle">Locus Properties</h2>
    <p  id="sectionDesc">Each Locus in ANTARES may have any of the following properties.</p>
  </div>

  <div class="results-row">
    <span class="results-count" id="resultsCount">&nbsp;</span>
    <span class="kbd-hint">Press <kbd class="kbd">/</kbd> to search</span>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="state-box">
      <div class="spinner"></div>
      <div class="state-title">Loading properties.json…</div>
      <div class="state-sub">Make sure <code>properties.json</code> is in the same directory as this HTML file.</div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const state = {
  locus: [],
  alert: [],
  activeTab:    'locus',
  search:       '',
  activeTypes:  new Set(),
  activeOrigins: new Set(),
  sortCol:  null,
  sortDir:  'asc',
  expanded: null,   // name of currently expanded row, or null
  loaded:   false,
};

// ═══════════════════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════════════════
async function loadData() {
  setStatus('loading', 'Loading properties.json…');
  const res = await fetch('./properties.json');
  if (!res.ok) throw new Error(`HTTP ${res.status} fetching properties.json`);
  const data = await res.json();
  state.locus = data.locus || [];
  state.alert = data.alert || [];
  setStatus('ok', `${state.locus.length} locus · ${state.alert.length} alert properties`);
  if (data.generated) {
    const d = new Date(data.generated);
    document.getElementById('genDate').textContent =
      'data from ' + d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }
  state.loaded = true;
}

// ═══════════════════════════════════════════════════════════
// STATUS
// ═══════════════════════════════════════════════════════════
function setStatus(cls, msg) {
  document.getElementById('statusDot').className   = `status-dot ${cls}`;
  document.getElementById('statusMsg').textContent = msg;
}

function showError(err) {
  setStatus('error', 'Failed to load properties.json');
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  const isFile = location.protocol === 'file:';
  box.innerHTML = `
    <h3>⚠ Could not load properties.json</h3>
    <p>Make sure <code>properties.json</code> is in the same directory as this HTML file.
    ${isFile ? `<br><br>⚠ You're on <code>file://</code> — run a local server instead:<br>
    <code>python -m http.server 8000</code> then open <code>http://localhost:8000/antares-properties.html</code>` : ''}
    <br><br>Generate the data: <code>pip install requests &amp;&amp; python scrape_antares.py</code>
    <br>Error: <code>${err.message}</code></p>`;
  document.getElementById('tableWrap').innerHTML = `
    <div class="state-box">
      <div class="state-title">properties.json not found</div>
      <div class="state-sub">Run <code>python scrape_antares.py</code> to generate it.</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// RELATED PROPERTIES
// ═══════════════════════════════════════════════════════════

// Extract the prefix from a property name: "ant_mag" → "ant", "ztf_g" → "ztf"
// Returns null if the name has no meaningful prefix (no underscore, or prefix is unique)
function getPrefix(name) {
  const idx = name.indexOf('_');
  return idx > 0 ? name.slice(0, idx) : null;
}

// Build a map of prefix → [names] from all properties in the current tab
function buildPrefixMap(data) {
  const map = {};
  for (const p of data) {
    const pfx = getPrefix(p.name);
    if (pfx) {
      if (!map[pfx]) map[pfx] = [];
      map[pfx].push(p.name);
    }
  }
  return map;
}

function getRelated(name, data, max = 8) {
  const pfx = getPrefix(name);
  const allNames = data.map(p => p.name);
  let related = [];

  // 1. Same prefix (excluding self) — primary group
  if (pfx) {
    const prefixGroup = allNames.filter(n => n !== name && getPrefix(n) === pfx);
    related = prefixGroup.slice(0, max);
  }

  // 2. If prefix group is small, pad with same-origin (excluding self and already listed)
  if (related.length < 3) {
    const thisProp   = data.find(p => p.name === name);
    const thisOrigin = thisProp ? thisProp.origin : null;
    if (thisOrigin) {
      const originGroup = data
        .filter(p => p.name !== name && p.origin === thisOrigin && !related.includes(p.name))
        .map(p => p.name)
        .slice(0, max - related.length);
      related = [...related, ...originGroup];
    }
  }

  return related.slice(0, max);
}

// ═══════════════════════════════════════════════════════════
// COPY UTIL
// ═══════════════════════════════════════════════════════════
function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const label = btn.querySelector('.copy-label');
    const orig  = label.textContent;
    label.textContent = 'copied!';
    setTimeout(() => { btn.classList.remove('copied'); label.textContent = orig; }, 1400);
  });
}

// ═══════════════════════════════════════════════════════════
// EXPAND PANEL HTML
// ═══════════════════════════════════════════════════════════
function expandHTML(prop) {
  const data    = activeData();
  const related = getRelated(prop.name, data);
  const pfx     = getPrefix(prop.name);
  const relatedLabel = pfx
    ? `related <span style="opacity:0.5">(${pfx}_*)</span>`
    : `related`;

  const relatedSection = related.length ? `
    <div class="expand-related">
      <span class="related-label">${relatedLabel}</span>
      <div class="related-chips">
        ${related.map(n =>
          `<button class="related-chip" data-jump="${esc(n)}">${esc(n)}</button>`
        ).join('')}
      </div>
    </div>` : '';

  const apiUrl = `https://api.antares.noirlab.edu/v1/locus_property/${prop.name}`;

  return `
    <div class="expand-inner">
      <div class="expand-desc">${esc(prop.description) || '<span style="color:var(--text-mute)">No description available.</span>'}</div>
      <div class="expand-actions">
        <button class="copy-btn" data-copy="${esc(prop.name)}">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1" stroke="currentColor" stroke-width="1.2"/>
            <path d="M1 7.5V1h6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span class="copy-label">${esc(prop.name)}</span>
        </button>
        <button class="copy-btn" data-copy='properties["${esc(prop.name)}"]'>
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1" stroke="currentColor" stroke-width="1.2"/>
            <path d="M1 7.5V1h6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span class="copy-label">properties["${esc(prop.name)}"]</span>
        </button>
        <a class="api-link" href="${apiUrl}" target="_blank" rel="noopener">↗ API record</a>
      </div>
      ${relatedSection}
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// CHIPS
// ═══════════════════════════════════════════════════════════
function buildChips() {
  const data    = activeData();
  const types   = [...new Set(data.map(p => p.type  ).filter(Boolean))].sort();
  const origins = [...new Set(data.map(p => p.origin).filter(Boolean))].sort();
  const c = document.getElementById('filterChips');
  c.innerHTML = '';
  origins.forEach(o => {
    c.appendChild(mkChip(o, `origin${state.activeOrigins.has(o) ? ' active' : ''}`, () => {
      state.activeOrigins.has(o) ? state.activeOrigins.delete(o) : state.activeOrigins.add(o);
      render();
    }));
  });
  if (origins.length && types.length) {
    const sep = document.createElement('div'); sep.className = 'chips-sep'; c.appendChild(sep);
  }
  types.forEach(t => {
    c.appendChild(mkChip(t, `type-${t}${state.activeTypes.has(t) ? ' active' : ''}`, () => {
      state.activeTypes.has(t) ? state.activeTypes.delete(t) : state.activeTypes.add(t);
      render();
    }));
  });
}

function mkChip(label, cls, onClick) {
  const b = document.createElement('button');
  b.className = `chip ${cls}`; b.textContent = label; b.onclick = onClick; return b;
}

// ═══════════════════════════════════════════════════════════
// FILTER / SORT
// ═══════════════════════════════════════════════════════════
function activeData() {
  return state.activeTab === 'locus' ? state.locus : state.alert;
}

function filteredData() {
  const q = state.search.toLowerCase().trim();
  return activeData().filter(p => {
    if (state.activeTypes.size   && !state.activeTypes.has(p.type))     return false;
    if (state.activeOrigins.size && !state.activeOrigins.has(p.origin)) return false;
    if (!q) return true;
    return p.name.toLowerCase().includes(q) ||
           p.description.toLowerCase().includes(q) ||
           p.origin.toLowerCase().includes(q) ||
           p.type.toLowerCase().includes(q);
  });
}

function sorted(data) {
  if (!state.sortCol) return data;
  return [...data].sort((a, b) => {
    const av = (a[state.sortCol]||'').toString().toLowerCase();
    const bv = (b[state.sortCol]||'').toString().toLowerCase();
    const cmp = av < bv ? -1 : av > bv ? 1 : 0;
    return state.sortDir === 'asc' ? cmp : -cmp;
  });
}

// ═══════════════════════════════════════════════════════════
// HTML HELPERS
// ═══════════════════════════════════════════════════════════
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hl(text, q) {
  if (!q) return esc(text);
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return esc(text).replace(re, m => `<mark>${m}</mark>`);
}
function badge(type) {
  const t   = type || '?';
  const cls = ['int','float','str','bool'].includes(t) ? `badge-${t}` : 'badge-other';
  return `<span class="badge ${cls}">${esc(t)}</span>`;
}
function originTag(o) {
  const lc  = (o||'').toLowerCase();
  const cls = lc === 'antares' ? 'origin-antares' : lc === 'ztf' ? 'origin-ztf' : '';
  return `<span class="origin-tag ${cls}">${esc(o)}</span>`;
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render() {
  if (!state.loaded) return;

  const lc = state.locus.length, ac = state.alert.length;
  document.getElementById('locusTabCount').textContent = lc ? ` ${lc}` : '';
  document.getElementById('alertTabCount').textContent = ac ? ` ${ac}` : '';

  const isLocus = state.activeTab === 'locus';
  document.getElementById('sectionTitle').textContent =
    isLocus ? 'Locus Properties' : 'Alert Properties';
  document.getElementById('sectionDesc').textContent =
    isLocus
      ? 'Each Locus in ANTARES may have any of the following properties.'
      : 'Each Alert in ANTARES may have any of the following properties.';

  buildChips();

  const q     = state.search.toLowerCase().trim();
  const rows  = sorted(filteredData());
  const total = activeData().length;

  document.getElementById('resultsCount').innerHTML = rows.length === total
    ? `<strong>${total}</strong> properties`
    : `<strong>${rows.length}</strong> of <strong>${total}</strong> properties`;

  if (rows.length === 0) {
    document.getElementById('tableWrap').innerHTML = `
      <div class="state-box">
        <div class="state-title">No matching properties</div>
        <div class="state-sub">Try a different search term, or click active filter chips to clear them.</div>
      </div>`;
    return;
  }

  const COLS = [
    { key: 'name',        label: 'Name' },
    { key: 'type',        label: 'Type' },
    { key: 'origin',      label: 'Origin' },
    { key: 'description', label: 'Description' },
  ];

  const ths = COLS.map(c => {
    let cls = state.sortCol === c.key ? `sorted-${state.sortDir}` : '';
    return `<th class="${cls}" data-col="${c.key}">${c.label}</th>`;
  }).join('');

  // Build rows — interleave expand rows inline
  let bodyHTML = '';
  for (const p of rows) {
    const isOpen = p.name === state.expanded;
    bodyHTML += `
      <tr class="data-row${isOpen ? ' expanded' : ''}" data-name="${esc(p.name)}">
        <td class="col-name">${hl(p.name, q)}</td>
        <td class="col-type">${badge(p.type)}</td>
        <td class="col-origin">${originTag(p.origin)}</td>
        <td class="col-desc">${hl(p.description, q)}</td>
      </tr>`;
    if (isOpen) {
      bodyHTML += `
        <tr class="expand-row">
          <td colspan="4">${expandHTML(p)}</td>
        </tr>`;
    }
  }

  document.getElementById('tableWrap').innerHTML =
    `<table><thead><tr>${ths}</tr></thead><tbody>${bodyHTML}</tbody></table>`;

  attachListeners();
}

// ═══════════════════════════════════════════════════════════
// LISTENERS (re-attached after each render)
// ═══════════════════════════════════════════════════════════
function attachListeners() {
  const wrap = document.getElementById('tableWrap');

  // Sort headers
  wrap.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (state.sortCol === col) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortCol = col; state.sortDir = 'asc'; }
      render();
    });
  });

  // Row click — toggle expand
  wrap.querySelectorAll('tr.data-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const name = tr.dataset.name;
      state.expanded = state.expanded === name ? null : name;
      render();
      // If opening, nudge into view gently
      if (state.expanded === name) {
        requestAnimationFrame(() => {
          const openRow = wrap.querySelector(`tr.data-row.expanded`);
          if (openRow) openRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      }
    });
  });

  // Copy buttons
  wrap.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();   // don't collapse the row
      copyToClipboard(btn.dataset.copy, btn);
    });
  });

  // API link — don't collapse the row
  wrap.querySelectorAll('.api-link').forEach(a => {
    a.addEventListener('click', e => e.stopPropagation());
  });

  // Related chips — jump to that property
  wrap.querySelectorAll('.related-chip').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const target = btn.dataset.jump;
      // If the target isn't in the current filtered view, clear search first
      const inView = filteredData().some(p => p.name === target);
      if (!inView) {
        state.search = '';
        state.activeTypes.clear();
        state.activeOrigins.clear();
        document.getElementById('searchInput').value = '';
        document.getElementById('searchClear').style.display = 'none';
      }
      state.expanded = target;
      render();
      requestAnimationFrame(() => {
        const openRow = document.querySelector(`tr.data-row.expanded`);
        if (openRow) openRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  });
}

// ═══════════════════════════════════════════════════════════
// GLOBAL EVENTS
// ═══════════════════════════════════════════════════════════
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', function () {
  state.search = this.value;
  state.expanded = null;
  searchClear.style.display = this.value ? 'block' : 'none';
  render();
});
searchClear.addEventListener('click', () => {
  state.search = ''; searchInput.value = '';
  searchClear.style.display = 'none';
  state.expanded = null;
  render();
});

document.getElementById('tabGroup').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  const tab = btn.dataset.tab;
  if (tab === state.activeTab) return;
  state.activeTab = tab;
  state.activeTypes.clear();
  state.activeOrigins.clear();
  state.expanded = null;
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault(); searchInput.focus();
  }
  if (e.key === 'Escape') {
    if (state.expanded) { state.expanded = null; render(); }
    else searchInput.blur();
  }
});

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
(async () => {
  try {
    await loadData();
    render();
  } catch (err) {
    showError(err);
    console.error('[ANTARES Properties Browser]', err);
  }
})();
</script>
</body>
</html>
